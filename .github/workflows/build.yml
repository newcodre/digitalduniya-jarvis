name: Build Android APK
on: [push, workflow_dispatch]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython virtualenv

      - name: Pre-configure Buildozer Config
        run: |
          yes | buildozer init
          # System configurations settings lock
          sed -i 's/# android.api = 33/android.api = 33/g' buildozer.spec
          sed -i 's/# android.minapi = 21/android.minapi = 24/g' buildozer.spec
          sed -i 's/# android.ndk = 25b/android.ndk = 25b/g' buildozer.spec

      - name: Flash Compile APK
        run: |
          yes | buildozer -v android debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDuniya-Jarvis-App
          path: bin/*.apk
          
