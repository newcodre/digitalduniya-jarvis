    from kivy.app import App
from kivy.uix.boxlayout import BoxLayout
from kivy.uix.button import Button
from kivy.uix.label import Label
from kivy.uix.textinput import TextInput

class JarvisMiniApp(App):
    def build(self):
        layout = BoxLayout(orientation='vertical', padding=20, spacing=10)

        # AI Reply Screen
        self.output = Label(text="JARVIS: Ask me anything about our robot, Boss...", font_size='15sp')
        
        # Input Box
        self.user_input = TextInput(text="how to make robot", multiline=False, size_hint=(1, 0.2))
        
        # Ask Button
        btn = Button(text="⚡ [ ASK JARVIS ]", size_hint=(1, 0.25))
        btn.bind(on_press=self.ask_ai)

        layout.add_widget(self.output)
        layout.add_widget(self.user_input)
        layout.add_widget(btn)
        return layout

    def ask_ai(self, instance):
        query = self.user_input.text.lower()
        
        # Instant ChatGPT style custom replies
        if "robot" in query or "machine" in query:
            self.output.text = "JARVIS: To make the robot, connect Servo 1 to Pin 5 and Servo 2 to Pin 6. I will help you program the core logic pins, Boss!"
        elif "voice" in query or "awaaz" in query:
            self.output.text = "JARVIS: Voice logic active. Audio signals will capture via mobile mic and process instantly into text commands."
        else:
            self.output.text = f"JARVIS: Analysis complete for '{query}'. DigitalDuniya system is ready to build this feature!"

if __name__ == '__main__':
    JarvisMiniApp().run()
    
